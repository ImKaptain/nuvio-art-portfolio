<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaptain Art Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0a0d;--card:#131318;--border:rgba(255,255,255,.08);--text:#f4f4f6;--muted:#8b8b96;--accent:#ffffff;--pill:rgba(255,255,255,.06)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh}
  header{position:sticky;top:0;z-index:50;background:rgba(10,10,13,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
  .header-inner{max-width:1500px;margin:0 auto;padding:1rem 1.75rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
  .brand{font-family:'Outfit',sans-serif;font-weight:900;font-size:1.15rem;letter-spacing:-.3px}
  .brand span{color:var(--muted);font-weight:600}
  nav{display:flex;gap:.4rem}
  nav button{background:transparent;border:1px solid transparent;color:var(--muted);font-family:'Outfit',sans-serif;font-weight:700;font-size:.85rem;padding:.5rem 1rem;border-radius:8px;cursor:pointer}
  nav button.active{background:var(--accent);color:#000}
  nav button:hover:not(.active){background:var(--pill);color:var(--text)}
  .search{background:var(--pill);border:1px solid var(--border);color:var(--text);padding:.5rem .9rem;border-radius:20px;font-size:.85rem;width:240px;outline:none}
  main{max-width:1500px;margin:0 auto;padding:1.75rem}
  .stat-bar{display:flex;gap:1.5rem;margin-bottom:1.5rem;color:var(--muted);font-size:.85rem}
  .stat-bar b{color:var(--text)}
  .grid{column-count:4;column-gap:1.1rem}
  @media(max-width:1300px){.grid{column-count:3}}
  @media(max-width:900px){.grid{column-count:2}}
  @media(max-width:560px){.grid{column-count:1}}
  .card{break-inside:avoid;margin-bottom:1.1rem;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .18s,border-color .18s;position:relative}
  .card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.25)}
  .card img{width:100%;display:block}
  .card-body{padding:.7rem .85rem .85rem}
  .card-title{font-family:'Outfit',sans-serif;font-weight:700;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-sub{color:var(--muted);font-size:.76rem;margin-top:.15rem}
  .badge{position:absolute;top:.6rem;right:.6rem;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.15);color:#fff;font-size:.68rem;font-weight:700;padding:.2rem .55rem;border-radius:6px}
  .empty{text-align:center;color:var(--muted);padding:4rem 1rem}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(14px);display:flex;align-items:center;justify-content:center;padding:2rem;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s}
  .modal.open{opacity:1;pointer-events:auto}
  .modal-card{background:#111116;border:1px solid var(--border);border-radius:14px;max-width:1000px;width:100%;max-height:88vh;overflow:auto;display:grid;grid-template-columns:1fr 320px}
  @media(max-width:820px){.modal-card{grid-template-columns:1fr}}
  .modal-img{background:#000;display:flex;align-items:center;justify-content:center;padding:1.5rem;position:relative}
  .modal-img img{max-width:100%;max-height:60vh;object-fit:contain;border-radius:6px}
  .modal-close{position:absolute;top:.75rem;right:.75rem;width:32px;height:32px;background:rgba(255,255,255,.1);border:1px solid var(--border);border-radius:50%;color:#fff;cursor:pointer;font-size:1.1rem}
  .modal-info{padding:1.5rem;display:flex;flex-direction:column;gap:1rem;border-left:1px solid var(--border)}
  .modal-info h2{font-family:'Outfit',sans-serif;font-size:1.15rem}
  .modal-info .meta{color:var(--muted);font-size:.82rem;display:flex;flex-direction:column;gap:.25rem}
  .copy-btn{background:#fff;color:#000;border:none;padding:.6rem;border-radius:8px;font-family:'Outfit',sans-serif;font-weight:800;font-size:.8rem;cursor:pointer}
  .copy-btn.copied{background:#10b981;color:#fff}
  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:2.5rem 1rem;border-top:1px solid var(--border);margin-top:2rem}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">Kaptain <span>Art Portfolio</span></div>
    <nav id="tabs">
      <button class="active" data-tab="live">Live Collection</button>
      <button data-tab="archive">Rotation Archive</button>
    </nav>
    <input class="search" id="search" placeholder="Search folders or titles...">
  </div>
</header>
<main>
  <div class="stat-bar" id="statBar"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">No matches. Try a different search.</div>
</main>
<footer>Kaptain Art Portfolio &middot; browse-only, images served from GitHub raw &middot; regenerated nightly</footer>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-img">
      <button class="modal-close" id="modalClose">&#10005;</button>
      <img id="modalImg" src="" alt="">
    </div>
    <div class="modal-info">
      <div>
        <h2 id="modalTitle"></h2>
        <div class="meta" id="modalMeta"></div>
      </div>
      <button class="copy-btn" id="copyBtn">Copy image URL</button>
    </div>
  </div>
</div>

  ]
};
let activeTab = 'live';

const grid = document.getElementById('grid');
const empty = document.getElementById('empty');
const statBar = document.getElementById('statBar');
const search = document.getElementById('search');
const tabs = document.querySelectorAll('#tabs button');
const modal = document.getElementById('modal');
const modalImg = document.getElementById('modalImg');
const modalTitle = document.getElementById('modalTitle');
const modalMeta = document.getElementById('modalMeta');
const copyBtn = document.getElementById('copyBtn');
let activeUrl = '';

function itemsForTab() {
  return activeTab === 'live' ? MANIFEST.live : MANIFEST.archive;
}

function render() {
  const q = search.value.toLowerCase().trim();
  const items = itemsForTab().filter(it => {
    const hay = [it.folder_title, it.collection_title, it.movie_title || ''].join(' ').toLowerCase();
    return hay.includes(q);
  });

  statBar.innerHTML = `<span><b>${items.length}</b> ${activeTab === 'live' ? 'live folders' : 'generations'}</span>` +
    (MANIFEST.generated_at ? `<span>Updated ${new Date(MANIFEST.generated_at).toLocaleString()}</span>` : '');

  grid.innerHTML = '';
  empty.style.display = items.length ? 'none' : 'block';

  items.forEach(it => {
    const cover = activeTab === 'live' ? (it.urls && it.urls.cover) : (it.files && it.files.cover);
    const hover = activeTab === 'live' ? (it.urls && it.urls.hover) : (it.files && it.files.hover);
    if (!cover) return;

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img src="${cover}" loading="lazy" alt="${it.folder_title}">
      ${activeTab === 'archive' ? `<span class="badge">${it.date || ''}</span>` : ''}
      <div class="card-body">
        <div class="card-title">${activeTab === 'live' ? it.folder_title : (it.movie_title || it.folder_title)}</div>
        <div class="card-sub">${it.collection_title}${activeTab === 'archive' ? ' &middot; ' + it.folder_title : ''}</div>
      </div>`;

    const img = card.querySelector('img');
    if (hover) {
      card.addEventListener('mouseenter', () => { img.src = hover; });
      card.addEventListener('mouseleave', () => { img.src = cover; });
    }

    card.addEventListener('click', () => openModal(it, cover));
    grid.appendChild(card);
  });
}

function openModal(it, cover) {
  modalImg.src = cover;
  activeUrl = cover;
  modalTitle.textContent = activeTab === 'live' ? it.folder_title : (it.movie_title || it.folder_title);
  modalMeta.innerHTML = `<span>${it.collection_title} &middot; ${it.folder_title}</span>` +
    (it.date ? `<span>Generated ${it.date}</span>` : '');
  copyBtn.textContent = 'Copy image URL';
  copyBtn.classList.remove('copied');
  modal.classList.add('open');
}

document.getElementById('modalClose').addEventListener('click', () => modal.classList.remove('open'));
modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(activeUrl);
  copyBtn.textContent = 'Copied!';
  copyBtn.classList.add('copied');
});

tabs.forEach(btn => btn.addEventListener('click', () => {
  tabs.forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeTab = btn.dataset.tab;
  render();
}));

search.addEventListener('input', render);
render();
</script>

</html>
